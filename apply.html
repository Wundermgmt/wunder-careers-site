<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply — Wunder Management</title>
<meta name="description" content="Apply for a remote role at Wunder Management, a European creator growth agency.">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="apply">

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">W</span>
      <span class="brand-text">Wunder Management <span class="brand-sub">Careers</span></span>
    </a>
    <a class="header-link" href="index.html">All open roles</a>
  </div>
</header>

<main id="main">
  <section class="role-hero">
    <div class="wrap">
      <a class="back-link" href="index.html">&larr; All open roles</a>
      <h1 id="roleTitle">Loading role&hellip;</h1>
      <div class="meta-grid" id="roleMeta"></div>
    </div>
  </section>

  <div class="wrap">
    <div class="layout">
      <article class="ad" id="roleAd" aria-label="Role description"></article>

      <aside class="form-panel">
        <section class="card" aria-labelledby="formHeading">
          <div class="card__head">
            <h2 id="formHeading">Apply for this role</h2>
            <p id="formSubhead">A few minutes. Your answers save as you go.</p>
            <div class="progress" id="progress" role="presentation"></div>
            <p class="step-count" id="stepCount"></p>
          </div>

          <form id="applyForm" novalidate>
            <div class="card__body">
              <div class="banner" id="banner" role="alert"></div>
              <div id="steps"></div>
              <!-- Bots fill every field they can find, including this one. -->
              <div style="position:absolute;left:-9999px" aria-hidden="true">
                <label for="hp">Do not fill this in</label>
                <input type="text" id="hp" name="website_url" tabindex="-1" autocomplete="off">
              </div>
              <p class="form-note" id="privacyNote"></p>
            </div>
            <div class="card__foot">
              <button type="button" class="btn btn--ghost" id="backBtn">Back</button>
              <button type="submit" class="btn btn--accent" id="nextBtn">Continue</button>
            </div>
          </form>

          <div class="done" id="done" role="status">
            <div class="done__mark" aria-hidden="true">&check;</div>
            <h2>Application received</h2>
            <p id="doneMessage"></p>
            <p style="margin-top:22px">
              <a class="btn btn--ghost" href="index.html">See other open roles</a>
            </p>
          </div>
        </section>
        <noscript>
          <div class="empty" style="margin-top:20px">
            <h2>This form needs JavaScript</h2>
            <p>Email <a href="mailto:ja@kgmodelmanagement.com">ja@kgmodelmanagement.com</a>
               and we will send you the application directly.</p>
          </div>
        </noscript>
      </aside>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; Wunder Management. All roles are full-time contractor positions.</span>
    <span class="footer-links">
      <a href="https://wundermgmt.com" target="_blank" rel="noopener">Company</a>
      <a href="https://www.instagram.com/lauris_kalnins" target="_blank" rel="noopener">Founder</a>
      <a href="https://wundermgmt.com/imprint" target="_blank" rel="noopener">Privacy</a>
      <a href="mailto:ja@kgmodelmanagement.com">Contact</a>
    </span>
  </div>
</footer>

<script src="assets/config.js"></script>
<script src="assets/forms.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
