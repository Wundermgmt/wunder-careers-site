name: Security secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  new-commit-secrets:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the commit being checked
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' 'gitleaks.tar.gz' | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan new commits without exposing secret values
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"
            head="$PUSH_AFTER"
          fi
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || exit 2
          git cat-file -e "$head^{commit}"
          if [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            range="$head"
          else
            [[ "$base" =~ ^[0-9a-f]{40}$ ]] || exit 2
            git cat-file -e "$base^{commit}"
            range="$base..$head"
          fi
          # Use standard rules independently of repository overrides or ignores.
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks-defaults.toml"
          : > "$RUNNER_TEMP/gitleaks-empty-ignore"
          set +e
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . \
            --config "$RUNNER_TEMP/gitleaks-defaults.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-empty-ignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner --log-level error \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json" \
            --log-opts "--diff-merges=first-parent $range"
          result=$?
          set -e
          if [[ "$result" -ne 0 ]]; then
            echo 'Secret scan failed. Review the changed commits privately; do not paste credentials into logs or comments.'
            exit "$result"
          fi
